limit_req_zone $binary_remote_addr zone=private_llm_rate:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=private_llm_conn:10m;
map_hash_bucket_size 128;

map $http_authorization $private_llm_authorized {
    default 0;
    "Bearer __KEY__" 1;
}

server {
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 8k;
    limit_conn private_llm_conn 2;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true}\n';
    }

    location /api/ {
        limit_req zone=private_llm_rate burst=3 nodelay;
        limit_req_status 429;

        if ($private_llm_authorized = 0) { return 401; }

        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/private-llm.access.log;
    error_log /var/log/nginx/private-llm.error.log warn;
}
